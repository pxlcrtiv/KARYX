[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karyx"
version = "0.1.0"
description = "Military-grade edge AI model optimization and deployment suite"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "onnx",
    "networkx",
    "numpy",
    "pycuda",
    "cryptography",
    "PyYAML",
    "docker",
    "click"
]

[project.optional-dependencies]
mcp = ["mcp"]

[project.scripts]
karyx = "karyx.cli.main:main"
mcp-karyx = "mcp_karyx.server:mcp.run"

[tool.setuptools.packages.find]
where = ["."]
include = ["karyx*", "mcp_karyx*"]
